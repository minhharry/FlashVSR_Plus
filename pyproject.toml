[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashvsr-plus"
version = "0.1.0"
description = "Inference pipeline for FlashVSR+ video super-resolution"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

# Runtime dependencies are intentionally installed from requirements.txt. In
# particular, this package does not replace a user's existing PyTorch/CUDA
# installation when installed by a host application such as ComfyUI.
dependencies = [
    "torch>=2.5.0,<2.8.0",
    "torchvision",
    "einops>=0.8",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "safetensors>=0.5",
    "tqdm>=4.66",
    "huggingface-hub>=0.28",
    "pyyaml>=6.0",
    "triton-windows==3.2.0.post21",
    "setuptools>=84.2.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]

[tool.setuptools.packages.find]
include = ["inference*", "model_io*", "models*", "flashvsr_plus*"]

[tool.setuptools.package-data]
flashvsr_plus = ["py.typed"]
